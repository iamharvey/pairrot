# pairrot 起步配置。用 pairrot init 生成到仓库根目录，文件名必须是大写的 REVIEW.toml。
# 提交并合进主干后，对之后的 PR 生效（规则只从 base 读取，只在工作区里的文件不生效）。
# 先观察一两周：意见照常发到 PR，但不让 check 失败。觉得意见靠谱，再把 fail_on_must_fix 改成 true。
fail_on_must_fix = false
must_fix_min_severity = "S2"     # S3 的意见只进摘要，不挡合并
preexisting = "recommend"        # 改动前就存在的问题只进摘要；想照常定级改成 keep

[correctness]                    # 逻辑错误、错误处理缺失，挂到行内
enabled = true
level = "must_fix"

[secrets]                        # 确定性密钥扫描，不经过模型
enabled = true
level = "must_fix"

[security]                       # 注入、越权、敏感数据进日志等，需写明攻击者可控的输入
enabled = true
level = "must_fix"

[performance]                    # 只进摘要，不挂行内
enabled = true
level = "recommend"

[compatibility]                  # 不兼容默认是故意的；只把 stable 里的路径当外部契约
enabled = true
stable = []                      # 例如 ["api/*", "proto/*"]
allow_break = []

[simplicity]                     # 不必要的复杂度：必须给替换代码，并说明行为和性能不变
enabled = true
level = "recommend"              # 先只做参考；有测试锁定、想让它挡合并时改成 must_fix
extension_points = []            # 故意留的扩展点，例如 ["plugins/*"]

# 这些路径不送模型，也不扫密钥。目录末尾的 / 表示该目录下全部文件。
# exclude = [
#   "tests/**",
#   "**/*_test.py",
#   "**/.cursor/**",
#   "skills/",
# ]

# 按路径覆盖：例如测试夹具里的假密钥不报。子规则清单见 README
# [[override]]
# paths = ["tests/**"]
# off = ["secrets"]

# 复杂度预算：不调模型，设了哪项就按哪项把关，超出时 check 失败
# [complexity_budget]
# max_net_added = 800
# max_single_use = 10
